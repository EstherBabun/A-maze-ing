[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A maze generation and solving library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ebabun", email = "ebabun@student.42belgium.be"},
    {name = "mmeurer", email = "mmeurer@student.42belgium.be"}
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]
